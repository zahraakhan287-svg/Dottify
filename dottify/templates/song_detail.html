{% extends "base.html" %}

{% block content %}
<h1>{{ song.title }}</h1>
<p>Album: <a href="{% url 'album_detail_slug' pk=song.album.pk slug=song.album.slug %}">{{ song.album.title }}</a></p>

{% if can_edit %}
    <a href="{% url 'song_update' pk=song.pk %}" class="btn btn-primary">Edit Song</a>
    <a href="{% url 'song_delete' pk=song.pk %}" class="btn btn-danger">Delete Song</a>
{% endif %}
{% endblock %}
