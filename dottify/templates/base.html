<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Dottify{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { 
            background: linear-gradient(to bottom, #f4f4f9, #ffffff); 
            color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            line-height: 1.6;
        }
        .navbar {
            background: linear-gradient(to right, #ff7e5f, #feb47b); 
            border-radius: 8px;
        }
        .navbar-brand, .nav-link {
            font-weight: 600;
            color: #fff !important;
            transition: all 0.3s ease;
        }
        .navbar-brand:hover, .nav-link:hover {
            color: #ffddc1 !important; 
            text-decoration: none;
        }
        .navbar-toggler {
            border-color: #fff;
        }
        .navbar-nav {
            margin-left: auto;
        }
        .nav-item + .nav-item {
            margin-left: 15px;
        }
        hr {
            border-color: #ddd;
        }
        .container-fluid {
            padding: 2rem;
        }
        .nav-link {
            padding: 10px 20px;
            border-radius: 25px;
            background-color: rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        .nav-link:hover {
            background-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-3px); 
        }
        .nav-link-active {
            background-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        html {
            scroll-behavior: smooth;
        }
        @media (max-width: 768px) {
            .navbar-nav {
                text-align: center;
                margin-top: 15px;
            }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light mb-4 p-3 shadow-sm" aria-label="Main Navigation">
    <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link nav-link-custom" href="{% url 'home' %}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-link-custom" href="{% url 'album_list' %}">Albums</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-link-custom" href="{% url 'album_search' %}?q=">Search</a>
                </li>
                {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link nav-link-custom" href="{% url 'album_create' %}">New Album</a>
                    </li>
                    <li class="nav-item">
                        <form action="{% url 'logout' %}" method="post" style="display:inline;">
                            {% csrf_token %}
                            <button type="submit" class="nav-link nav-link-custom" style="background:none; border:none; padding:0; cursor:pointer;">
                                Logout
                            </button>
                        </form>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class="nav-link nav-link-custom" href="{% url 'login' %}">Login</a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>

<hr>

{% block content %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
