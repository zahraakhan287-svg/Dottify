<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <title>{% block title %}Dottify{% endblock %}</title>

    <link rel="stylesheet" href="https://bootswatch.com/5/darkly/bootstrap.min.css">
        <link href="https://fonts.googleapis.com/css2?family=Orbitron&family=Quicksand&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(to right, #1e1e2f, #2a2a3f);
            color: #f8f9fa;
        }    
        .navbar-brand {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: #00d8ff !important;
        }

        .nav-link {
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: #ff4081 !important;
        }

        .container {
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-link {
            color: #ffc107 !important;
        }

        .btn-link:hover {
            text-decoration: underline;
        }
    </style>

</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 p-3 shadow-sm" aria-label="Main Navigation">
    <div class="container-fluid">

        <a class="navbar-brand" href="{% url 'home' %}">Dottify</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'home' %}">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'album_list' %}">Albums</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'album_search' %}?q=">Search</a>
                </li>

                {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'album_create' %}">New Album</a>
                    </li>

                    <li class="nav-item">
                        <form action="{% url 'logout' %}" method="post" style="display:inline;">
                            {% csrf_token %}
                            <button type="submit" class="nav-link btn btn-link" style="padding:0;">
                              Logout
                                </button>
                        </form>
                    </li>



                {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'login' %}">Login</a>
                    </li>
                {% endif %}

            </ul>
        </div>
    </div>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
