{% extends "base.html" %}

{% block content %}
<div class="container my-4">
    <h1 class="mb-4 text-center text-light">All Albums</h1>

    {% if albums %}
    <div class="row row-cols-1 row-cols-md-6 g-2">
        {% for album in albums %}
        <div class="col">
            <div class="album-card p-2" style="background-color: #222; border-radius: 8px; overflow: hidden; text-align: center; transition: transform 0.2s, box-shadow 0.2s;">
                
                {% if album.cover_image %}
                    <div style="width: 100%; padding-top: 100%; position: relative; overflow: hidden; border-radius: 6px;">
                        <img src="{{ album.cover_image.url }}" alt="{{ album.title }}" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;">
                    </div>
                {% else %}
                    <div style="width: 100%; padding-top: 100%; position: relative; overflow: hidden; border-radius: 6px;">
                        <img src="{{ MEDIA_URL }}no_cover.jpg" alt="No cover" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;">
                    </div>
                {% endif %}

                <div class="album-info mt-2">
                    <h6 class="text-truncate text-light mb-0" title="{{ album.title }}">{{ album.title }}</h6>
                    <small class="text-muted d-block text-truncate" title="{{ album.artist_name }}">{{ album.artist_name }}</small>
                    <a href="{% url 'album_detail' pk=album.pk %}" class="btn btn-sm btn-outline-light mt-1 w-100">View</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <p class="text-center text-light">No albums available.</p>
    {% endif %}
</div>

<style>
.album-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 16px rgba(255, 255, 255, 0.1);
}
.album-card h6, .album-card small {
    text-shadow: 0 1px 2px rgba(0,0,0,0.7);
    font-size: 0.85rem;
}
body {
    background-color: #121212;
}
</style>
{% endblock %}
